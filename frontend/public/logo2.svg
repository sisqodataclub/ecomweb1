<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="goldRefined" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C69C6D;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FDB931;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#FFFFE0;stop-opacity:1" /> <stop offset="70%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(250, 230)" text-anchor="middle">
    
    <path d="
      M -70,-60 
      L -70,60 
      Q -70,70 -60,70 
      L 0,70 
      Q 40,70 60,50      
      M -70,0 L -30,0    
      M -70,-60 
      C -30,-80 80,-80 100,-60" 
      fill="none" stroke="url(#goldRefined)" stroke-width="8" stroke-linecap="square" filter="url(#softGlow)" />

    <path d="M 60,-55 L 60,55" 
          fill="none" stroke="url(#goldRefined)" stroke-width="8" stroke-linecap="square" filter="url(#softGlow)" />

    <path d="M -85,-60 L -55,-60 M -85,60 L -55,60 M 45,-55 L 75,-55 M 45,55 L 75,55" 
          fill="none" stroke="url(#goldRefined)" stroke-width="4" stroke-linecap="square" />

    <path d="M 40,60 Q 60,95 120,85" 
          fill="none" stroke="url(#goldRefined)" stroke-width="5" stroke-linecap="round" />

    <text x="0" y="150" font-family="'Trajan Pro', 'Cinzel', 'Times New Roman', serif" 
          font-size="44" fill="url(#goldRefined)" letter-spacing="5" font-weight="bold">
      ÉQUIVA ICONIC
    </text>

    <defs>
      <linearGradient id="fadeLine" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0" />
        <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0" />
      </linearGradient>
    </defs>
    <rect x="-150" y="170" width="300" height="2" fill="url(#fadeLine)" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDB931;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9E7D2B;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="175" y="150" width="150" height="180" rx="10" ry="10" 
        fill="none" stroke="url(#goldGradient)" stroke-width="3" />
  
  <rect x="235" y="130" width="30" height="20" 
        fill="url(#goldGradient)" />
  
  <rect x="225" y="100" width="50" height="25" rx="2" ry="2" 
        fill="none" stroke="url(#goldGradient)" stroke-width="2" />

  <path d="M250 180 Q250 180, 250 180 Q230 220, 230 240 A20 20 0 0 0 270 240 Q270 220, 250 180 Z" 
        fill="url(#goldGradient)" filter="url(#glow)" />

  <text x="50%" y="400" text-anchor="middle" 
        fill="url(#goldGradient)" 
        font-family="'Didot', 'Bodoni MT', 'Times New Roman', serif" 
        font-size="42" letter-spacing="8" font-weight="100">
    EQUIVA
  </text>
  
  <text x="50%" y="430" text-anchor="middle" 
        fill="#D4AF37" 
        font-family="sans-serif" 
        font-size="10" letter-spacing="4" style="text-transform: uppercase; opacity: 0.8;">
    TIMELESS DISTINCTION
  </text>
</svg>
